# proxychains-ng config for telegram-bot-api (installed at /etc/proxychains-tbapi.conf).
#
# Why: tdlib's MTProto connections to Telegram's DCs ignore both env proxies and
# the server's --proxy flag (that one is webhook-only). This box has no direct
# route to Telegram (ISP block), and TUN capture is deliberately OFF — so the
# service is wrapped in proxychains4, which LD_PRELOADs every connect() through
# the explicit local proxy below. No TUN dependence, no magic routing.
strict_chain
quiet_mode
proxy_dns
remote_dns_subnet 224
tcp_connect_time_out 8000
tcp_read_time_out 15000
# Keep localhost + LAN off-proxy (it binds 127.0.0.1:8081; LAN stays local).
localnet 127.0.0.0/255.0.0.0
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0

[ProxyList]
# clashvless mixed port — speaks SOCKS5 and HTTP-CONNECT on :1900
socks5 127.0.0.1 1900
